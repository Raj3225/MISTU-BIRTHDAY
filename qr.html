<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Mistu's Secret QR ❤️</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            text-align: center;

            font-family: Arial, sans-serif;

            color: white;

            background:
                radial-gradient(
                    circle at top left,
                    #ff4f91,
                    transparent 40%
                ),

                radial-gradient(
                    circle at bottom right,
                    #8e44ad,
                    transparent 40%
                ),

                linear-gradient(
                    135deg,
                    #180018,
                    #4b073d,
                    #170020
                );

        }


        .card {

            width: min(600px, 92%);

            padding: 40px 25px;

            border-radius: 30px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.10
                );

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.20
                );

            backdrop-filter:
                blur(15px);

            box-shadow:
                0 20px 60px
                rgba(
                    0,
                    0,
                    0,
                    0.45
                );

        }


        .heart {

            font-size: 75px;

            margin-bottom: 10px;

            animation:
                heartbeat 1.2s infinite;

        }


        h1 {

            margin: 10px 0 15px;

            font-size: 40px;

            text-shadow:
                0 0 20px
                rgba(
                    255,
                    100,
                    180,
                    0.7
                );

        }


        p {

            font-size: 18px;

            line-height: 1.6;

        }


        .instruction {

            color: #ffd1e7;

        }


        /* QR CODE BOX */

        .qr-wrapper {

            width: 330px;

            height: 330px;

            max-width: 90vw;

            max-height: 90vw;

            margin: 30px auto;

            padding: 15px;

            display: flex;

            align-items: center;

            justify-content: center;

            background: white;

            border-radius: 22px;

            box-shadow:
                0 10px 40px
                rgba(
                    0,
                    0,
                    0,
                    0.4
                );

        }


        #qrcode {

            display: flex;

            align-items: center;

            justify-content: center;

        }


        #qrcode img {

            display: block;

            max-width: 100%;

            height: auto;

        }


        .secret {

            margin-top: 20px;

            padding: 12px;

            border-radius: 15px;

            background:
                rgba(
                    0,
                    0,
                    0,
                    0.20
                );

            color: #ffacd4;

            font-size: 14px;

        }


        .note {

            color: #ffacd4;

            font-weight: bold;

        }


        @keyframes heartbeat {

            0%,
            100% {

                transform:
                    scale(1);

            }

            50% {

                transform:
                    scale(1.15);

            }

        }


        @media (max-width: 600px) {

            .card {

                padding: 30px 18px;

            }


            h1 {

                font-size: 30px;

            }


            .heart {

                font-size: 60px;

            }


            .qr-wrapper {

                width: 300px;

                height: 300px;

            }

        }

    </style>

</head>


<body>


    <div class="card">


        <!-- HEART -->

        <div class="heart">
            ❤️
        </div>


        <!-- TITLE -->

        <h1>
            A Little Secret
        </h1>


        <p class="instruction">

            Scan this QR code with
            your birthday surprise scanner.

        </p>


        <!-- QR CODE -->

        <div class="qr-wrapper">

            <div id="qrcode"></div>

        </div>


        <p class="note">

            📷 Point the camera at this code ❤️

        </p>


        <div class="secret">

            Your surprise is waiting... 💕

        </div>


    </div>



    <!-- QR CODE LIBRARY -->

    <script
        src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js">
    </script>



    <script>

        /*
        ==================================================
        IMPORTANT
        ==================================================

        PUT YOUR PUBLIC MISTU-BIRTHDAY WEBSITE ADDRESS
        BELOW.

        Example:

        const websiteURL =
        "https://your-website-address/";

        Do NOT leave YOUR_WEBSITE_ADDRESS here.
        ==================================================
        */


        const websiteURL =
            "YOUR_WEBSITE_ADDRESS";


        /*
        ==================================================
        CREATE QR CODE
        ==================================================
        */


        new QRCode(

            document.getElementById("qrcode"),

            {

                text: websiteURL,

                width: 290,

                height: 290,

                colorDark: "#000000",

                colorLight: "#ffffff",

                correctLevel:
                    QRCode.CorrectLevel.H

            }

        );

    </script>


</body>

</html>
