<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Mistu Secret QR ❤️</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;

            font-family: Arial, sans-serif;

            text-align: center;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #ff758c,
                    #ff7eb3,
                    #c471ed,
                    #f64f59
                );
        }

        .card {
            width: 100%;

            max-width: 500px;

            padding: 35px 25px;

            border-radius: 30px;

            background:
                rgba(255,255,255,0.18);

            backdrop-filter: blur(15px);

            box-shadow:
                0 20px 50px
                rgba(0,0,0,0.3);
        }

        .heart {
            font-size: 60px;

            margin-bottom: 10px;
        }

        h1 {
            font-size: 32px;

            margin-bottom: 10px;
        }

        p {
            font-size: 17px;

            line-height: 1.6;
        }

        .qr-container {
            width: 320px;

            height: 320px;

            max-width: 100%;

            margin: 25px auto;

            padding: 15px;

            background: white;

            border-radius: 20px;

            display: flex;

            justify-content: center;

            align-items: center;
        }

        .qr-container img {
            width: 100%;

            height: 100%;

            object-fit: contain;

            display: block;
        }

        .instruction {
            font-size: 15px;

            opacity: 0.9;
        }

    </style>

</head>


<body>

    <div class="card">

        <div class="heart">
            ❤️
        </div>

        <h1>
            Mistu's Secret QR
        </h1>

        <p>
            Scan this QR code using the
            camera scanner on the birthday website 📷
        </p>


        <!-- QR CODE -->

        <div class="qr-container">

            <img
                src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=https%3A%2F%2Fraj3225.github.io%2FMISTU-BIRTHDAY%2F"
                alt="Mistu Birthday QR Code">

        </div>


        <p>
            Scan me to unlock something special 💕
        </p>

        <p class="instruction">
            📱 Open the birthday website on another phone
            and scan this QR.
        </p>

    </div>

</body>

</html>
