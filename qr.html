<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Mistu Secret QR ❤️</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #ff758c,
                    #ff7eb3,
                    #c471ed
                );

            color: white;

            text-align: center;

            padding: 20px;
        }

        .card {

            width: 100%;

            max-width: 500px;

            padding: 35px;

            border-radius: 30px;

            background:
                rgba(255,255,255,0.18);

            backdrop-filter: blur(15px);

            box-shadow:
                0 20px 50px
                rgba(0,0,0,0.25);
        }

        h1 {

            font-size: 32px;

            margin-bottom: 10px;
        }

        p {

            line-height: 1.6;
        }

        #qrcode {

            width: 290px;

            height: 290px;

            margin: 25px auto;

            padding: 15px;

            background: white;

            border-radius: 20px;

            display: flex;

            align-items: center;

            justify-content: center;
        }

        .heart {

            font-size: 50px;
        }

    </style>

</head>


<body>

    <div class="card">

        <div class="heart">
            ❤️
        </div>

        <h1>
            Mistu's Secret QR
        </h1>

        <p>
            Scan this QR code using the
            birthday website camera.
        </p>

        <div id="qrcode"></div>

        <p>
            Something special is waiting for you... 💕
        </p>

    </div>


    <!-- QR CODE LIBRARY -->

    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js">
    </script>


    <script>

        /*
            YOUR GITHUB PAGES WEBSITE
        */

        const websiteURL =
            "https://raj3225.github.io/MISTU-BIRTHDAY/";


        new QRCode(
            document.getElementById("qrcode"),
            {

                text: websiteURL,

                width: 260,

                height: 260,

                colorDark: "#000000",

                colorLight: "#ffffff",

                correctLevel:
                    QRCode.CorrectLevel.H

            }
        );

    </script>

</body>

</html>
